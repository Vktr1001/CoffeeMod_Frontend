<!doctype html>
<html lang="es">

<!-- Navbar y footer se cargan desde main.js -->
<!-- Navbar -->
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/img/Grano.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
        try {
        document.documentElement.dataset.theme = localStorage.getItem('coffeemod-theme') || 'dark';
        } catch {
        document.documentElement.dataset.theme = 'dark';
        }
    </script>
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Contacto | CoffeeMod</title>
</head>

    <body data-pagina="contacto">
        <div id="header"></div>

        <main class="about-pagina">
            <section class="container-fluid px-4 px-lg-5 py-5">
                <p class="about-mono mt-lg-4">INICIO / CONTACTO</p>
                <h1 class="about-titulos display-1 fw-bold">Contáctanos.</h1>
                <p class="lead text-secondary col-lg-7"> ¿Tienes dudas sobre tu pedido o sobre qué equipo elegir? Escríbenos y te respondemos en menos de 24 horas.
            </p>

<!-- Container de formulario de contacto -->
                <div class="contacto-caja p-4 p-lg-5 mt-4 mb-lg-4">
                    <h2 class="about-titulos h4 fw-bold mb-4">Envíanos un mensaje</h2>

                    <form id="formContacto" action="https://formspree.io/f/mgaavwop" method="POST">
                        <div class="row g-3">
                        <div class="col-md-6">
                            <label for="nombre" class="form-label about-mono">NOMBRE</label>
                            <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Tu nombre" required />
                        </div>
                        <div class="col-md-6">
                            <label for="correo" class="form-label about-mono">CORREO</label>
                            <input type="email" id="correo" name="email" class="form-control" placeholder="tu@correo.com" required />
                        </div>
                        <div class="col-12">
                            <label for="telefono" class="form-label about-mono">TELÉFONO</label>
                            <input type="tel" id="telefono" name="telefono" class="form-control" placeholder="Escribe 10 dígitos" inputmode="numeric" maxlength="14" pattern="\d{2}( \d{2}){4}" title="Escribe 10 dígitos" />
                        </div>
                        <div class="col-12">
                            <label for="mensaje" class="form-label about-mono">MENSAJE</label>
                            <textarea id="mensaje" name="mensaje" class="form-control" rows="4" placeholder="Cuéntanos qué necesitas" required></textarea>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-enviar about-mono fw-bold px-4 py-2">ENVIAR MENSAJE</button>
                        </div>
                        </div>
                    </form>

                    <div id="alertaEnviado" class="alert contacto-alerta d-none justify-content-between align-items-center mt-3 mb-0">
                        <span id="textoAlerta">Mensaje enviado. Te respondemos pronto.</span>
                        <button type="button" class="btn-close" aria-label="Cerrar"></button>
                    </div>
                </div>
            </section>
        </main>

        <div id="footer"></div>

<!-- Foother -->
        <script type="module" src="/src/main.js"></script>
        
        <script type="module" src="/src/assets/js/contacto.js"></script>
</body>
</html>
