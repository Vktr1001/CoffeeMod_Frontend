  <body>
 <div id="header"></div>

     <section class="IntroRegistro">
        <small class="text-uppercase text-danger " style="font-size: 0.75rem;">CUENTA NUEVA</small>
        <h1 class="about-titulos display-2 fw-bold">Arma tu</h1>
        <h1 class="about-titulos display-2 fw-bold">barra.</h1>
        <p class="lead text-secondary col-lg-10">
          Crea tu cuenta para guardar equipo, seguir tus pedidos y recibir guias de calibracion.
        </p>
      </section>

      <div class="imagen"><img src="../src/assets/img/productos/orbit.jpg" alt="Barra de cafe" width="730px" height="733px"></div>
      
    <form class="CamposUwU">

      <div class="registrar">
        <h6>NOMBRE COMPLETO *</h6>
        <input type="text" placeholder="Nombre"  class="form-control rounded-0">
      </div>
      
      <div class="registrar">
          <h6>CORREO *</h6>
        <input type="email" placeholder="tucorreo@mail.com" class="form-control rounded-0">
      </div>

        <div class="registrar">
          <h6>NUMERO *</h6>
        <input type="number" placeholder="00-0000-0000" class="form-control rounded-0">
      </div>
        
      <div class="registrar">
         <h6>CONTRASEÑA *</h6>
        <input type="password" placeholder="Mínimo 6 caracteres" class="form-control rounded-0">
      </div>

       <div class="registrar">
         <h6>CONFIRMAR CONTRASEÑA *</h6>
        <input type="password" placeholder="Repite tu contraseña" class="form-control rounded-0">
      </div>

        <div class="registrar">
         <h6>¿QUE TANTO SABES DE CAFE? (OPCIONAL)</h6>
            <div  >
            <button type="button" class="cafePro" aria-pressed="false" > PRINCIPIANTE </button>
            <button type="button" class="cafePro" aria-pressed="false" > INTERMEDIO </button>
            <button type="button" class="cafePro" aria-pressed="false" > AVANZADO </button>
            </div>
        </div>

       <div class="registrar">
        <input type="checkbox" > Acepto términos y aviso de privacidad.</input>
      </div>

      <div class="registrar">
        <button type="submit" class="registraloB" >CREAR CUENTA</button>
      </div>

      <div>
        <button class="cafePro" style="border: 0;"><a type="button" href="login.html"><h6 class="cafePro">¿YA TIENES UNA CUENTA? INICIA SESIÓN -></h6></a></button>
      </div>
    </form>



<div id="footer"></div>
